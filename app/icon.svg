<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>

    <linearGradient id="tealCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#2DD4BF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Khung nền vuông bo góc tinh tế -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)"/>
  
  <!-- Viền kỹ thuật Blueprint CAD -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#tealCyanGrad)" stroke-width="8" stroke-opacity="0.35"/>
  
  <!-- 4 điểm neo kỹ thuật (CAD Corner Ticks) -->
  <circle cx="56" cy="56" r="6" fill="#2DD4BF" opacity="0.6"/>
  <circle cx="456" cy="56" r="6" fill="#38BDF8" opacity="0.6"/>
  <circle cx="56" cy="456" r="6" fill="#2DD4BF" opacity="0.6"/>
  <circle cx="456" cy="456" r="6" fill="#38BDF8" opacity="0.6"/>

  <!-- Logo trung tâm: < P /> -->
  <g filter="url(#cyanGlow)">
    <!-- Dấu mở ngoặc nhọn: < -->
    <path d="M 140 180 L 70 256 L 140 332" fill="none" stroke="#2DD4BF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Chữ cái P trung tâm -->
    <path d="M 210 350 L 210 162 L 285 162 C 330 162 355 188 355 225 C 355 262 330 288 285 288 L 210 288" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Dấu đóng ngoặc nhọn: /> -->
    <path d="M 372 332 L 442 256 L 372 180" fill="none" stroke="#38BDF8" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
